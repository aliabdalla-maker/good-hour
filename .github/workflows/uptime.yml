# External uptime probe — NFR-005.
#
# The register recorded "no SLO stated, no monitoring, no alerting. Outages are
# found by looking", which is what happened: the production API URL was broken for
# an entire session before anyone noticed, and four unwanted ADMIN accounts sat on
# the live database for eight minutes until a row count was read by hand.
#
# This probes from outside the deployment, on a schedule, and opens a GitHub issue
# when the service is unreachable — using the built-in GITHUB_TOKEN, so it needs no
# credential anyone has to provision.
#
# Two deliberate design points:
#
#   * It probes /health/ready, not /health. A process with a dead database answers
#     /health happily, so a probe pointed there reports 100% through an outage.
#   * It alerts after TWO consecutive failures, not one. A single failed probe is as
#     likely to be the runner's network as the service, and an alert that cries wolf
#     gets muted — which costs more availability than the outage it was meant to
#     catch.
#
# What this is NOT: a paging system. Nobody is woken up. It is the difference
# between "an outage leaves a durable record someone will see" and "an outage is
# invisible", which is the gap that actually mattered here.

name: uptime

on:
  schedule:
    # Every 10 minutes — matches UPTIME_PROBE_INTERVAL_MINUTES in packages/shared/src/slo.ts.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe readiness
        id: probe
        run: |
          set +e
          URL="${{ vars.HEALTH_URL || 'https://api.goodhour.shop/health/ready' }}"
          echo "probing $URL"
          BODY=$(curl -sS --max-time 30 -w '\n%{http_code}' "$URL")
          CODE=$(echo "$BODY" | tail -n1)
          PAYLOAD=$(echo "$BODY" | sed '$d')
          echo "code=$CODE"
          echo "$PAYLOAD"
          {
            echo "code=$CODE"
            echo "payload<<PAYLOAD_EOF"
            echo "$PAYLOAD"
            echo "PAYLOAD_EOF"
          } >> "$GITHUB_OUTPUT"
          # A cold start on a free instance can exceed the probe timeout without the
          # service being down, so retry once before calling it a failure.
          if [ "$CODE" != "200" ]; then
            sleep 20
            RETRY=$(curl -sS --max-time 45 -o /dev/null -w '%{http_code}' "$URL")
            echo "retry=$RETRY"
            echo "retry=$RETRY" >> "$GITHUB_OUTPUT"
            [ "$RETRY" = "200" ] && exit 0
            exit 1
          fi
          exit 0

      - name: Open or update an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Uptime probe failing: /health/ready is not returning 200";
            const body = [
              `Probe failed at ${new Date().toISOString()}.`,
              "",
              `HTTP status: \`${{ steps.probe.outputs.code }}\` (retry: \`${{ steps.probe.outputs.retry }}\`)`,
              "",
              "Response body:",
              "```json",
              `${{ toJSON(steps.probe.outputs.payload) }}`,
              "```",
              "",
              "`/health/ready` checks the database and Redis, so a 503 here names the",
              "failing dependency in `checks`. See docs/OPERATIONS.md.",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n");

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "uptime",
            });

            // One issue per incident, commented on repeatedly — not a new issue every
            // ten minutes. An alert channel that floods is an alert channel that gets
            // filtered, which is the failure mode this whole workflow exists to avoid.
            const open = existing.data.find((i) => i.title === title);
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["uptime"],
              });
            }

      - name: Close the incident issue once healthy again
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Uptime probe failing: /health/ready is not returning 200";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "uptime",
            });
            const open = existing.data.find((i) => i.title === title);
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body: `Recovered at ${new Date().toISOString()} — /health/ready returned 200.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                state: "closed",
              });
            }
