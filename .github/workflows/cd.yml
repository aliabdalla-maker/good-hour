name: CD

# Build and publish container images to GitHub Container Registry (GHCR).
#   - push to main/master  -> tags: edge, sha-<short>
#   - push a tag  v1.2.3    -> tags: 1.2.3, 1.2, latest
on:
  push:
    branches: [main, master]
    tags: ["v*"]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, web, worker]
    steps:
      - uses: actions/checkout@v4

      # Derive the image path from this repo (owner/repo), lowercased as GHCR
      # requires — no hardcoded namespace. e.g. aliabdalla-maker/good-hour
      #  -> ghcr.io/aliabdalla-maker/good-hour-api
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deployment target is environment-specific. This job is a guarded placeholder:
  # wire it to your host (SSH + `docker compose pull && up -d`), a Kubernetes
  # rollout, or a PaaS deploy hook. It runs only for version tags.
  deploy:
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - name: Deploy (configure target)
        run: |
          echo "Images published to GHCR for ${GITHUB_REF_NAME}."
          echo "TODO: pull & roll out on the production host (SSH/k8s/PaaS)."
