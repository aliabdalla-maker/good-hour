services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gihtcx
      POSTGRES_PASSWORD: gihtcx_dev_password
      POSTGRES_DB: gihtcx
    ports:
      # Host 5433 -> container 5432 to avoid clashing with a native Postgres on 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gihtcx"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Host 6380 -> container 6379 to avoid clashing with a native Redis on 6379.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies pending Prisma migrations, then exits. api/worker wait for
  # this to complete so they never boot against a schema-less database. Reuses
  # the api image (it already carries the db package, prisma CLI and schema).
  migrate:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: goodhours-api
    command: ["npm", "run", "db:deploy"]
    environment:
      DATABASE_URL: postgresql://gihtcx:gihtcx_dev_password@postgres:5432/gihtcx?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: goodhours-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://gihtcx:gihtcx_dev_password@postgres:5432/gihtcx?schema=public
      REDIS_URL: redis://redis:6379
      API_PUBLIC_URL: http://localhost:4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    image: goodhours-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://gihtcx:gihtcx_dev_password@postgres:5432/gihtcx?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        # Browser-reachable API origin, inlined into the client bundle at build time.
        NEXT_PUBLIC_API_URL: http://localhost:4000
    image: goodhours-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
