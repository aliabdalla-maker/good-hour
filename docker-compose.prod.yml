# Production stack for goodhour.shop. Self-contained (does NOT extend the dev
# docker-compose.yml). Only Caddy publishes ports; everything else is reachable
# only on the internal Docker network.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Secrets and public URLs are read from a local `.env` on the server
# (copy .env.production.example -> .env and fill it in).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gihtcx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gihtcx}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gihtcx}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: goodhours-api
    command: ["sh", "-c", "npm run db:deploy && npm run samples --workspace=packages/db"]
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: goodhours-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    image: goodhours-worker
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.goodhour.shop}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-admin@softwareequality.com}
    image: goodhours-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    labels:
      # Bump this value to force Caddy recreation after config/mount changes.
      com.goodhour.caddy-revision: "8"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - sites:/srv/sites:ro
      # AEP-X is deployed by the self-hosted GitHub runner on this OCI host.
      # Mount the parent so atomic current-symlink swaps are immediately visible.
      - /srv/aepx:/srv/aepx:ro
    depends_on:
      - web
      - api

  # Static company website served by Caddy straight from its public GitHub repo.
  # AEP-X is separate: aepx-core deploys releases under /srv/aepx.
  sitesync:
    image: alpine/git:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        repo=https://github.com/aliabdalla-maker/softwareequality-website.git
        dir=/sites/softwareequality-website
        while true; do
          if [ -d "$$dir/.git" ]; then
            git -C "$$dir" fetch -q --depth 1 origin main && git -C "$$dir" reset -q --hard origin/main
          else
            rm -rf "$$dir" && git clone -q --depth 1 "$$repo" "$$dir"
          fi
          sleep 120
        done
    volumes:
      - sites:/sites

  se-api:
    image: node:22-alpine
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: "8787"
    working_dir: /sites
    command:
      - sh
      - -c
      - |
        f=/sites/softwareequality-website/api/server.mjs
        until [ -f "$$f" ]; do echo "waiting for site sync"; sleep 5; done
        while true; do
          sum=$$(md5sum "$$f" | cut -d' ' -f1)
          node "$$f" & pid=$$!
          while kill -0 $$pid 2>/dev/null && [ "$$(md5sum "$$f" | cut -d' ' -f1)" = "$$sum" ]; do sleep 20; done
          kill $$pid 2>/dev/null; wait $$pid 2>/dev/null
          echo "se-api: code changed or exited, restarting"; sleep 2
        done
    volumes:
      - sites:/sites:ro
    depends_on:
      - sitesync

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  sites:
