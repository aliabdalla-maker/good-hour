# Production stack for goodhour.shop. Self-contained (does NOT extend the dev
# docker-compose.yml). Only Caddy publishes ports; everything else is reachable
# only on the internal Docker network.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Secrets and public URLs are read from a local `.env` on the server
# (copy .env.production.example -> .env and fill it in).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gihtcx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gihtcx}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gihtcx}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: goodhours-api
    # Apply migrations, then ensure the clearly-labelled sample listings
    # (packages/db/prisma/samples.ts; set SAMPLE_LISTINGS=off in .env to hide them).
    command: ["sh", "-c", "npm run db:deploy && npm run samples --workspace=packages/db"]
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: goodhours-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    image: goodhours-worker
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined at BUILD time — rebuild to change them.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.goodhour.shop}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-admin@softwareequality.com}
    image: goodhours-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    labels:
      # Bump this value to force Caddy to be recreated on the next auto-deploy
      # (e.g. to retry HTTPS certificate issuance after a DNS change).
      com.goodhour.caddy-revision: "6"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - sites:/srv/sites:ro
    depends_on:
      - web
      - api

  # Static websites served by Caddy straight from public GitHub repos: pulls
  # each repo every 2 minutes, so a push to main is live shortly after.
  # softwareequality.com: github.com/aliabdalla-maker/softwareequality-website
  sitesync:
    image: alpine/git:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        repo=https://github.com/aliabdalla-maker/softwareequality-website.git
        dir=/sites/softwareequality-website
        while true; do
          if [ -d "$$dir/.git" ]; then
            git -C "$$dir" fetch -q --depth 1 origin main && git -C "$$dir" reset -q --hard origin/main
          else
            rm -rf "$$dir" && git clone -q --depth 1 "$$repo" "$$dir"
          fi
          sleep 120
        done
    volumes:
      - sites:/sites

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  sites:
